##############################
# AIRFLOW COMMON CONFIG
##############################
x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: airflow.providers.celery.executors.celery_executor.CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID}:0"
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  networks:
    - airflow-network

##############################
# SERVICES
##############################
services:

  ##############################
  # PostgreSQL
  ##############################
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./init-druid.sql:/docker-entrypoint-initdb.d/init-druid.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - airflow-network

  ##############################
  # Redis
  ##############################
  redis:
    image: redis:7.2-bookworm
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
    restart: always
    networks:
      - airflow-network

  ##############################
  # MongoDB
  ##############################
  mongo:
    image: mongo:7
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT1}:27017"
      - "${MONGO_PORT2}:27018"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    restart: always
    networks:
      - airflow-network

  ##############################
  # Mongo Express
  ##############################
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${ME_CONFIG_MONGODB_ADMINUSERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${ME_CONFIG_MONGODB_ADMINPASSWORD}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: ${ME_CONFIG_MONGODB_PORT}
    ports:
      - "${ME_PORT}:8081"
    depends_on:
      - mongo
    restart: always
    networks:
      - airflow-network

  ##############################
  # Zookeeper
  ##############################
  zookeeper:
    image: zookeeper:3.5.10
    container_name: zookeeper
    ports:
      - "2181:2181"
    restart: always
    networks:
      - airflow-network

  ##############################
  # Druid Coordinator
  ##############################
  druid-coordinator:
    image: apache/druid:28.0.0
    container_name: druid-coordinator
    command: coordinator
    environment:
      druid_xms: ${druid_xms}
      druid_xmx: ${druid_xmx}
      druid_metadata_storage_type: ${druid_metadata_storage_type}
      druid_metadata_storage_connector_connectURI: ${druid_metadata_storage_connector_connectURI}
      druid_metadata_storage_connector_user: ${druid_metadata_storage_connector_user}
      druid_metadata_storage_connector_password: ${druid_metadata_storage_connector_password}
      druid_extensions_loadList: ${druid_extensions_loadList}
    ports:
      - "${DRUID_COORDINATOR_PORT}:8081"
    volumes:
      - druid-data:/opt/druid/var
    depends_on:
      - zookeeper
      - postgres
    restart: unless-stopped
    networks:
      - airflow-network

  ##############################
  # Druid Broker
  ##############################
  druid-broker:
    image: apache/druid:28.0.0
    container_name: druid-broker
    command: broker
    environment:
      druid_xms: ${druid_xms}
      druid_xmx: ${druid_xmx}
    ports:
      - "${DRUID_BROKER_PORT}:8082"
    depends_on:
      - druid-coordinator
    restart: unless-stopped
    networks:
      - airflow-network

  ##############################
  # Druid Historical
  ##############################
  druid-historical:
    image: apache/druid:28.0.0
    container_name: druid-historical
    command: historical
    environment:
      druid_xms: ${druid_xms}
      druid_xmx: ${druid_xmx}
    ports:
      - "${DRUID_HISTORICAL_PORT}:8083"
    depends_on:
      - druid-coordinator
    restart: unless-stopped
    networks:
      - airflow-network

  ##############################
  # Druid MiddleManager
  ##############################
  druid-middlemanager:
    image: apache/druid:28.0.0
    container_name: druid-middlemanager
    command: middleManager
    environment:
      druid_xms: ${druid_xms}
      druid_xmx: ${druid_xmx}
    ports:
      - "${DRUID_MIDDLEMANAGER_PORT}:8091"
    depends_on:
      - druid-coordinator
    restart: unless-stopped
    networks:
      - airflow-network

  ##############################
  # Druid Router
  ##############################
  druid-router:
    image: apache/druid:28.0.0
    container_name: druid-router
    command: router
    environment:
      druid_xms: ${druid_xms}
      druid_xmx: ${druid_xmx}
    ports:
      - "${DRUID_ROUTER_PORT}:8888"
    depends_on:
      - druid-coordinator
    restart: unless-stopped
    networks:
      - airflow-network

  ##############################
  # Airflow Services
  ##############################
  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    command: celery worker
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command: >
      -c "
      mkdir -p /opt/airflow/{logs,dags,plugins,config,data} &&
      chown -R ${AIRFLOW_UID}:0 /opt/airflow &&
      /entrypoint airflow db migrate &&
      /entrypoint airflow users create
        --username ${_AIRFLOW_WWW_USER_USERNAME}
        --password ${_AIRFLOW_WWW_USER_PASSWORD}
        --firstname Airflow
        --lastname Admin
        --role Admin
        --email admin@example.com
      "
    user: "0:0"
    networks:
      - airflow-network

  ##############################
  # PgAdmin
  ##############################
  pgadmin:
    image: elestio/pgadmin
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    networks:
      - airflow-network

##############################
# NETWORKS & VOLUMES
##############################
networks:
  airflow-network:
    name: airflow-network

volumes:
  postgres-db-volume:
  mongo-data:
  mongo-config:
  druid-data:
